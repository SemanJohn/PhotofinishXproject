<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Finish Realtime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; height: 100dvh; height: 100vh; overflow: hidden; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; }
        
        /* Header Tajuk & Jam */
        header { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: #1e1e1e; border-bottom: 1px solid #333; height: 46px; flex-shrink: 0; }
        .app-title { font-size: 0.9rem; font-weight: bold; color: #00ffcc; white-space: nowrap; }
        .timer-display { font-size: 1.3rem; font-family: monospace; font-weight: bold; color: #00ffcc; background: #000; padding: 2px 8px; border-radius: 4px; border: 1px solid #00ffcc; }

        /* Kawasan Utama (Kamera + Canvas) */
        main { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 4px; overflow: hidden; }

        /* Kotak Kamera Pratonton */
        .video-box { position: relative; width: 100%; height: 30vh; background: #000; border-radius: 6px; overflow: hidden; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .finish-line-overlay { position: absolute; top: 0; bottom: 0; width: 2px; background-color: red; z-index: 10; }

        /* Bar Info Semakan Masa */
        .inspector-bar { font-size: 0.8rem; color: #aaa; text-align: center; background: #1a1a1a; padding: 4px; border-radius: 4px; flex-shrink: 0; border: 1px solid #333; }
        .inspector-bar span { color: #ffeb3b; font-weight: bold; font-family: monospace; font-size: 0.95rem; }

        /* Kanvas Gambar Photo Finish */
        .canvas-container { flex: 1; width: 100%; background: #000; border: 1.5px solid #00ffcc; border-radius: 6px; overflow-x: auto; overflow-y: hidden; position: relative; }
        canvas { display: block; height: 100%; background: #111; cursor: crosshair; }

        /* Panel Butang Utama */
        footer { background: #1e1e1e; padding: 6px 8px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .button-row { display: grid; grid-template-columns: 1fr 1fr 1.2fr 0.8fr; gap: 6px; }
        button { padding: 9px 2px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 0.75rem; text-align: center; }
        .btn-start { background-color: #28a745; color: white; }
        .btn-stop { background-color: #dc3545; color: white; }
        .btn-inspect { background-color: #ffc107; color: black; }
        .btn-save { background-color: #17a2b8; color: white; }

        .slider-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.7rem; color: #ccc; }
        .slider-group { display: flex; align-items: center; gap: 4px; flex: 1; }
        input[type="range"] { width: 100%; accent-color: #00ffcc; height: 16px; }
    </style>
</head>
<body>

    <header>
        <div class="app-title">PHOTO FINISH</div>
        <div class="timer-display" id="timerDisplay">00:00.000</div>
    </header>

    <main>
        <!-- Kamera Pratonton -->
        <div class="video-box">
            <video id="webcam" autoplay playsinline muted></video>
            <div class="finish-line-overlay" id="finishLine" style="left: 50%;"></div>
        </div>

        <!-- Bar Keputusan Semakan Masa -->
        <div class="inspector-bar">
            Masa Pelari: <span id="inspectTime">--:--.---</span>
        </div>

        <!-- Kanvas Photo Finish -->
        <div class="canvas-container" id="canvasScroll">
            <canvas id="photoCanvas" height="300" width="3000"></canvas>
        </div>
    </main>

    <footer>
        <div class="button-row">
            <button class="btn-start" id="btnStart">▶ START</button>
            <button class="btn-stop" id="btnStop">⏹ STOP</button>
            <button class="btn-inspect" id="btnInspect">🔍 SEMAK SLICE</button>
            <button class="btn-save" id="btnSave">💾 SIMPAN</button>
        </div>

        <div class="slider-row">
            <div class="slider-group">
                <label>Garisan:</label>
                <input type="range" id="slitPosSlider" min="0" max="100" value="50">
            </div>
            <div class="slider-group" style="max-width: 110px;">
                <label>Slice:</label>
                <input type="range" id="sliceWidthSlider" min="1" max="5" value="2">
                <span id="sliceWidthVal">2px</span>
            </div>
        </div>
    </footer>

<script>
    const video = document.getElementById('webcam');
    const finishLine = document.getElementById('finishLine');
    const photoCanvas = document.getElementById('photoCanvas');
    const ctx = photoCanvas.getContext('2d');
    const timerDisplay = document.getElementById('timerDisplay');
    const inspectTime = document.getElementById('inspectTime');
    
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const btnInspect = document.getElementById('btnInspect');
    const btnSave = document.getElementById('btnSave');
    const slitPosSlider = document.getElementById('slitPosSlider');
    const sliceWidthSlider = document.getElementById('sliceWidthSlider');
    const sliceWidthVal = document.getElementById('sliceWidthVal');
    const canvasScroll = document.getElementById('canvasScroll');

    let isScanning = false;
    let startTime = null;
    let timerInterval = null;
    let currentX = 0;
    let sliceWidth = parseInt(sliceWidthSlider.value);
    let slitPercent = 0.5;
    
    let timeAtPixel = [];
    let rawCanvasData = null; // Menyimpan salinan asal imej untuk garisan semakan

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    frameRate: { ideal: 60 }
                },
                audio: false
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                photoCanvas.height = video.videoHeight || 480;
                clearCanvas();
            };
        } catch (err) {
            alert('Gagal mengakses kamera: ' + err.message);
        }
    }

    slitPosSlider.addEventListener('input', (e) => {
        slitPercent = e.target.value / 100;
        finishLine.style.left = `${e.target.value}%`;
    });

    sliceWidthSlider.addEventListener('input', (e) => {
        sliceWidth = parseInt(e.target.value);
        sliceWidthVal.innerText = `${sliceWidth}px`;
    });

    // 1. BUTANG START
    btnStart.addEventListener('click', () => {
        isScanning = true;
        startTime = performance.now();
        currentX = 0;
        timeAtPixel = [];
        clearCanvas();
        
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(updateTimerDisplay, 10);
        inspectTime.innerText = "Larian Sedang Berlangsung...";
    });

    // 2. BUTANG STOP
    btnStop.addEventListener('click', () => {
        isScanning = false;
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        inspectTime.innerText = "Larian Diberhentikan. Tekan 'SEMAK SLICE' untuk menyemak masa.";
        saveCanvasState();
    });

    // 3. BUTANG SEMAK SLICE
    btnInspect.addEventListener('click', () => {
        isScanning = false;
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        saveCanvasState();
        inspectTime.innerText = "Sentuh pada gambar di bawah untuk semak masa pelari";
        canvasScroll.scrollLeft = 0;
    });

    function saveCanvasState() {
        rawCanvasData = ctx.getImageData(0, 0, photoCanvas.width, photoCanvas.height);
    }

    function restoreCanvasState() {
        if (rawCanvasData) {
            ctx.putImageData(rawCanvasData, 0, 0);
        }
    }

    function updateTimerDisplay() {
        if (!startTime) return;
        const elapsed = performance.now() - startTime;
        timerDisplay.innerText = formatTime(elapsed);
    }

    function formatTime(ms) {
        if (ms < 0 || isNaN(ms)) return "00:00.000";
        const totalSec = Math.floor(ms / 1000);
        const min = Math.floor(totalSec / 60).toString().padStart(2, '0');
        const sec = (totalSec % 60).toString().padStart(2, '0');
        const milli = Math.floor(ms % 1000).toString().padStart(3, '0');
        return `${min}:${sec}.${milli}`;
    }

    function clearCanvas() {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, photoCanvas.width, photoCanvas.height);
        currentX = 0;
        timeAtPixel = [];
        rawCanvasData = null;
    }

    function processFrame() {
        if (isScanning && video.readyState === video.HAVE_ENOUGH_DATA) {
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            const sourceX = Math.floor(videoWidth * slitPercent);

            if (currentX + sliceWidth > photoCanvas.width) {
                expandCanvas();
            }

            ctx.drawImage(
                video,
                sourceX, 0, sliceWidth, videoHeight,
                currentX, 0, sliceWidth, photoCanvas.height
            );

            const currentTime = startTime ? (performance.now() - startTime) : 0;
            for (let w = 0; w < sliceWidth; w++) {
                timeAtPixel[currentX + w] = currentTime;
            }

            if (startTime) {
                drawTimeMark(currentX, currentTime);
            }

            currentX += sliceWidth;
            canvasScroll.scrollLeft = currentX;
        }

        requestAnimationFrame(processFrame);
    }

    function expandCanvas() {
        const oldData = ctx.getImageData(0, 0, photoCanvas.width, photoCanvas.height);
        photoCanvas.width += 1000;
        ctx.putImageData(oldData, 0, 0);
    }

    function drawTimeMark(x, elapsedMs) {
        const sec = elapsedMs / 1000;
        if (Math.floor(sec) > Math.floor((elapsedMs - 20) / 1000)) {
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, photoCanvas.height - 25);
            ctx.lineTo(x, photoCanvas.height);
            ctx.stroke();

            ctx.fillStyle = '#00ffcc';
            ctx.font = '10px monospace';
            ctx.fillText(`${Math.floor(sec)}s`, x + 2, photoCanvas.height - 5);
        }
    }

    // Klik/Sentuh Gambar Slice
    photoCanvas.addEventListener('click', (e) => {
        const rect = photoCanvas.getBoundingClientRect();
        const clickX = Math.floor(e.clientX - rect.left);
        
        if (timeAtPixel[clickX] !== undefined) {
            restoreCanvasState();

            // Lukis garisan penanda kuning di lokasi sentuhan
            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(clickX, 0);
            ctx.lineTo(clickX, photoCanvas.height);
            ctx.stroke();

            inspectTime.innerText = `${formatTime(timeAtPixel[clickX])}`;
        } else {
            inspectTime.innerText = "Tiada rekod masa pada titik ini";
        }
    });

    // Butang Simpan
    btnSave.addEventListener('click', () => {
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = Math.max(currentX, 100);
        exportCanvas.height = photoCanvas.height;
        const exportCtx = exportCanvas.getContext('2d');
        exportCtx.drawImage(photoCanvas, 0, 0, exportCanvas.width, exportCanvas.height, 0, 0, exportCanvas.width, exportCanvas.height);

        const link = document.createElement('a');
        link.download = `photo_finish_${Date.now()}.png`;
        link.href = exportCanvas.toDataURL('image/png');
        link.click();
    });

    initCamera();
    requestAnimationFrame(processFrame);
</script>

</body>
</html>
